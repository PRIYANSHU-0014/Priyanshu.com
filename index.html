<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Music ves</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#02020a;
    color:white;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

.player{
    position:fixed;
    z-index:5;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:500px;
    text-align:center;
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
    text-shadow:0 0 15px #00eaff;
}

audio{
    width:100%;
}

.hint{
    margin-top:8px;
    font-size:12px;
    opacity:.6;
}
</style>
</head>

<body>

<canvas id="visualizer"></canvas>

<div class="player">
    <div class="title">priyanshu exploit</div>

    <audio id="audio" controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div class="hint">
        Play dabao — animation music ke saath react karega
    </div>
</div>

<script>

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");
const audio = document.getElementById("audio");

let W,H;

function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

resize();
window.addEventListener("resize",resize);


// Audio analyser
const AudioContext =
    window.AudioContext || window.webkitAudioContext;

let audioCtx;
let analyser;
let source;
let data;

audio.addEventListener("play",()=>{

    if(!audioCtx){

        audioCtx = new AudioContext();

        analyser = audioCtx.createAnalyser();

        analyser.fftSize = 256;

        data = new Uint8Array(
            analyser.frequencyBinCount
        );

        source = audioCtx.createMediaElementSource(audio);

        source.connect(analyser);
        analyser.connect(audioCtx.destination);
    }

    audioCtx.resume();

    animate();
});


let particles=[];

function createParticle(){

    particles.push({
        x:W/2,
        y:H/2,
        angle:Math.random()*Math.PI*2,
        speed:Math.random()*4+1,
        size:Math.random()*3+1,
        life:1
    });
}


function animate(){

    requestAnimationFrame(animate);

    if(!analyser) return;

    analyser.getByteFrequencyData(data);

    ctx.fillStyle="rgba(2,2,10,.18)";
    ctx.fillRect(0,0,W,H);

    // Music power
    let bass=0;

    for(let i=0;i<15;i++){
        bass += data[i];
    }

    bass /= 15;

    let power=bass/255;


    // Central glow
    let radius=70+power*130;

    let gradient=ctx.createRadialGradient(
        W/2,H/2,10,
        W/2,H/2,radius
    );

    gradient.addColorStop(0,"white");
    gradient.addColorStop(.15,"#00ffff");
    gradient.addColorStop(.45,"#0077ff");
    gradient.addColorStop(1,"transparent");

    ctx.fillStyle=gradient;

    ctx.beginPath();
    ctx.arc(W/2,H/2,radius,0,Math.PI*2);
    ctx.fill();


    // Circular waveform
    let bars=80;

    for(let i=0;i<bars;i++){

        let index=Math.floor(
            i/data.length*data.length
        );

        let value=data[index] || 0;

        let angle=(i/bars)*Math.PI*2;

        let inner=100;
        let outer=inner+value*.65;

        let x1=W/2+Math.cos(angle)*inner;
        let y1=H/2+Math.sin(angle)*inner;

        let x2=W/2+Math.cos(angle)*outer;
        let y2=H/2+Math.sin(angle)*outer;

        ctx.strokeStyle=
            `hsl(${180+i*2},100%,60%)`;

        ctx.lineWidth=3;

        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }


    // Particles
    if(power>.25){

        for(let i=0;i<3;i++){
            createParticle();
        }
    }

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x += Math.cos(p.angle)*s.speed;
        p.y += Math.sin(p.angle)*p.speed;

        p.life-=.012;

        ctx.globalAlpha=p.life;

        ctx.fillStyle="#00eaff";

        ctx.shadowBlur=15;
        ctx.shadowColor="#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        if(p.life<=0){
            particles.splice(i,1);
        }
    }

    
}

</script>

</body>
  </html>
